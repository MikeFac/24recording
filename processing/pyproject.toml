[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbox-audio-processing"
version = "0.1.0"
description = "Immutable-original audio cleanup and transcription proof for Blackbox Replacement"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcription = ["faster-whisper==1.2.1"]
dev = ["ruff==0.16.1"]

[project.scripts]
blackbox-audio = "blackbox_audio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
